name: Status monitor

# Runs OUTSIDE Minimo's infrastructure (GitHub-hosted), so detection + the page
# stay up even during a full Minimo/Dokploy outage.
on:
  schedule:
    - cron: '*/15 * * * *'   # email probe every 15 min
    - cron: '0 */4 * * *'    # + WhatsApp probe every 4h (sends a real message)
    - cron: '17 * * * *'     # + AI assistant probe hourly (one cheap LLM+KB call)
    - cron: '23 9 * * *'     # + AI on WhatsApp once a day (its reply goes out from Mo's number)
  workflow_dispatch:          # manual run probes everything

concurrency:
  group: status-monitor
  cancel-in-progress: false

permissions:
  contents: write             # commit the refreshed status.json + history

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Check out the branch tip at job start, not the SHA frozen at trigger time:
      # a queued run (lagging cron / manual) otherwise commits on a stale base and its
      # push is rejected when an earlier run pushed meanwhile. Runs are serialized by
      # the concurrency group, so the tip is never moved while this job runs.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      # Headless Chromium for the public forms render probe (forms_probe.py),
      # only on the hourly cron / manual run, so the 15-min runs stay ~10 s.
      - name: Install headless Chromium (forms probe)
        if: github.event.schedule == '17 * * * *' || github.event_name == 'workflow_dispatch'
        run: |
          pip install --quiet playwright==1.61.0
          python -m playwright install --with-deps chromium

      - name: Run probes
        id: probe
        env:
          MINIMO_PROD_API_KEY: ${{ secrets.MINIMO_PROD_API_KEY }}
          # Dedicated WhatsApp probe key (co36/BeautyGo WABA). check.py prefers it,
          # falling back to MINIMO_PROD_API_KEY when unset.
          WHATSAPP_PROD_API_KEY: ${{ secrets.WHATSAPP_PROD_API_KEY }}
          MAILOSAUR_SERVER_ID: ${{ secrets.MAILOSAUR_SERVER_ID }}
          MAILOSAUR_APIKEY: ${{ secrets.MAILOSAUR_APIKEY }}
          TRANSACTIONAL_TEST_UID_PROD: ${{ secrets.TRANSACTIONAL_TEST_UID_PROD }}
          WHATSAPP_TEST_RECIPIENT: ${{ secrets.WHATSAPP_TEST_RECIPIENT }}
          # AI on every channel (check.py): co25 key with only the whatsapp permission,
          # the prod @minimoaibot token, the prod Slack app "Mo" signing secret.
          AI_PROBE_API_KEY: ${{ secrets.AI_PROBE_API_KEY }}
          TELEGRAM_MO_BOT_TOKEN: ${{ secrets.TELEGRAM_MO_BOT_TOKEN }}
          SLACK_SIGNING_SECRET: ${{ secrets.SLACK_SIGNING_SECRET }}
          # Public anon JWT (already in the prod JS bundle) — Supabase health ping only. Not a secret.
          SUPABASE_URL: https://nelourjougsxqvekwfqt.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5lbG91cmpvdWdzeHF2ZWt3ZnF0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0OTUwNjQsImV4cCI6MjA5NjA3MTA2NH0.pI2pl5S98zDersRoyxlEMCsPaJp-Cp7Z6i_rnTfQEAU
          # WhatsApp only on the 4h cron or a manual run (avoids buzzing a phone every 15 min)
          PROBE_WHATSAPP: ${{ github.event.schedule == '0 */4 * * *' || github.event_name == 'workflow_dispatch' }}
          # AI assistant only on its hourly cron or a manual run (real LLM call)
          PROBE_ASSISTANT: ${{ github.event.schedule == '17 * * * *' || github.event_name == 'workflow_dispatch' }}
          # AI on WhatsApp only on its daily cron or a manual run: each run makes Mo's
          # number (co25 ch17) send one reply to the fake sender 15550001111, which Meta
          # rejects (131026). Hourly that was ~24 failed sends a day from the only live
          # Mo number (Andrea, 2026-11-09: daily).
          PROBE_AI_WHATSAPP: ${{ github.event.schedule == '23 9 * * *' || github.event_name == 'workflow_dispatch' }}
          # Public sign-up forms render probe: same hourly gate (needs the Chromium step above).
          # Code of the permanent synthetic form (PROD co22 form 42), public by design.
          PROBE_FORMS: ${{ github.event.schedule == '17 * * * *' || github.event_name == 'workflow_dispatch' }}
          FORMS_PROBE_CODE: U32C20Y
        run: python3 check.py

      - name: Commit refreshed status
        run: |
          git config user.name  "minimo-status-bot"
          git config user.email "status-bot@users.noreply.github.com"
          git add status.json data/history.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "status: ${{ steps.probe.outputs.overall }} ($(date -u +%FT%TZ))"
            git push
          fi

      - name: Notify Telegram on failure
        if: steps.probe.outputs.failed == 'true' && env.TG_TOKEN != ''
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TRANSACTIONAL_TEST_TELEGRAM_CHANNEL }}
          OVERALL: ${{ steps.probe.outputs.overall }}
          SUMMARY: ${{ steps.probe.outputs.summary }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          MSG="🔴 Minimo status: ${OVERALL} — ${SUMMARY}. Page: https://status.minimo.it  Run: ${RUN_URL}"
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT}" \
            --data-urlencode "text=${MSG}"
