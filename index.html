<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Minimo — System Status</title>
<meta name="description" content="Live operational status of Minimo's email & WhatsApp sending." />
<style>
  :root{
    --bg:#fafaf9; --card:#fff; --text:#1c1917; --muted:#78716c; --border:#e7e5e4;
    --ok:#16a34a; --ok-bg:#dcfce7; --degraded:#d97706; --down:#dc2626; --down-bg:#fee2e2;
    --dot-empty:#e7e5e4; --shadow:0 1px 2px rgba(0,0,0,.04),0 1px 3px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#0c0a09; --card:#1c1917; --text:#f5f5f4; --muted:#a8a29e; --border:#292524;
           --ok-bg:#052e16; --down-bg:#450a0a; --dot-empty:#292524; --shadow:none; }
  }
  *{box-sizing:border-box}
  html,body{overflow-x:hidden}
  body{margin:0;background:var(--bg);color:var(--text);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:760px;margin:0 auto;padding:48px 20px 80px}
  header{display:flex;align-items:baseline;gap:10px;margin-bottom:28px}
  .wordmark{height:23px;width:auto;color:var(--text);display:block;flex:0 0 auto}
  .logo-status{font-size:19px;font-weight:500;color:var(--muted);letter-spacing:-.01em}
  .banner{display:flex;align-items:center;gap:12px;padding:18px 20px;border-radius:14px;
    background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow);margin-bottom:28px}
  .banner .big{width:12px;height:12px;border-radius:50%;flex:0 0 auto}
  .banner h1{font-size:18px;margin:0;font-weight:600}
  .banner .sub{color:var(--muted);font-size:13px;margin-top:2px}
  .comp{background:var(--card);border:1px solid var(--border);border-radius:14px;
    box-shadow:var(--shadow);padding:18px 20px;margin-bottom:14px}
  .comp-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .comp-name{display:flex;align-items:center;gap:10px;font-weight:600}
  .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
  .status-label{font-size:13px;font-weight:600}
  .desc{color:var(--muted);font-size:13px;margin-top:2px;margin-left:19px}
  .bars{display:flex;gap:2px;margin-top:16px;height:30px;align-items:stretch;width:100%}
  /* min-width:0 lets 90 bars shrink to fit any width — no horizontal overflow on mobile */
  .bar{flex:1 1 0;border-radius:2px;background:var(--dot-empty);min-width:0;transition:opacity .1s}
  .bar:hover{opacity:.7}
  .bars-legend{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:6px}
  .ok{background:var(--ok)} .degraded{background:var(--degraded)} .down{background:var(--down)}
  .t-ok{color:var(--ok)} .t-degraded{color:var(--degraded)} .t-down{color:var(--down)}
  .b-ok{background:var(--ok)} .b-degraded{background:var(--degraded)} .b-down{background:var(--down)}
  footer{margin-top:36px;color:var(--muted);font-size:12px;text-align:center;line-height:1.7}
  .stale{background:var(--down-bg);border-color:var(--down)}
  .incidents{margin-top:32px}
  .incidents h2{font-size:14px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 12px}
  .inc{padding:14px 0;border-top:1px solid var(--border)}
  .inc .d{color:var(--muted);font-size:12px}
  a{color:inherit}
  @media (max-width:520px){
    .wrap{padding:32px 14px 64px}
    .comp,.banner{padding:16px}
    .bars{gap:1px}
    .wordmark{height:21px}
    .logo-status{font-size:17px}
    .comp-top{gap:8px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <svg viewBox="0 0 694 114" fill="none" xmlns="http://www.w3.org/2000/svg" class="wordmark" aria-label="Minimo"><path d="M0 110V3.99995H24.8L27 17.3999C30.0667 12.3333 34.6 8.19995 40.6 4.99995C46.6 1.79995 53.5333 0.199951 61.4 0.199951C68.6 0.199951 74.8667 1.79995 80.2 4.99995C85.6667 8.19995 89.8667 12.7999 92.8 18.7999C95.7333 13.4666 100.267 9.06662 106.4 5.59995C112.667 1.99995 119.867 0.199951 128 0.199951C138.933 0.199951 147.667 3.79995 154.2 11C160.733 18.2 164 27.8666 164 40V110H133.2V41.6C133.2 36.9333 131.867 33.2666 129.2 30.6C126.667 27.8 123.2 26.4 118.8 26.4C112.533 26.4 107.4 28.2666 103.4 32C99.4 35.6 97.4 40.2666 97.4 46V110H66.6V41.6C66.6 36.9333 65.2667 33.2666 62.6 30.6C60.0667 27.8 56.6 26.4 52.2 26.4C45.9333 26.4 40.8 28.2666 36.8 32C32.8 35.6 30.8 40.2666 30.8 46V110H0Z" fill="currentColor"/><path d="M213.808 110H183.008V3.99995H213.808V110Z" fill="currentColor"/><path d="M234.18 110V3.99995H258.98L261.58 19C264.513 13.4 269.046 8.86662 275.18 5.39996C281.446 1.93329 288.446 0.199951 296.18 0.199951C307.38 0.199951 316.313 3.79995 322.98 11C329.78 18.2 333.18 27.8666 333.18 40V110H302.38V41.6C302.38 37.0666 300.913 33.4666 297.98 30.7999C295.046 28.1333 291.046 26.8 285.98 26.8C279.98 26.8 274.98 28.6 270.98 32.2C266.98 35.8 264.98 40.4666 264.98 46.2V110H234.18Z" fill="currentColor"/><path d="M382.948 110H352.148V3.99995H382.948V110Z" fill="currentColor"/><path d="M403.32 110V3.99995H428.12L430.32 17.3999C433.387 12.3333 437.92 8.19995 443.92 4.99995C449.92 1.79995 456.854 0.199951 464.72 0.199951C471.92 0.199951 478.187 1.79995 483.52 4.99995C488.987 8.19995 493.187 12.7999 496.12 18.7999C499.054 13.4666 503.587 9.06662 509.72 5.59995C515.987 1.99995 523.187 0.199951 531.32 0.199951C542.254 0.199951 550.987 3.79995 557.52 11C564.054 18.2 567.32 27.8666 567.32 40V110H536.52V41.6C536.52 36.9333 535.187 33.2666 532.52 30.6C529.987 27.8 526.52 26.4 522.12 26.4C515.854 26.4 510.72 28.2666 506.72 32C502.72 35.6 500.72 40.2666 500.72 46V110H     <span class="logo-status">Status</span>
  </header>

  <div class="banner" id="banner">
    <div class="big" style="background:var(--dot-empty)"></div>
    <div>
      <h1 id="overall">Loading status…</h1>
      <div class="sub" id="updated"></div>
    </div>
  </div>

  <div id="components"></div>

  <div class="incidents" id="incidents" style="display:none">
    <h2>Recent incidents</h2>
    <div id="incident-list"></div>
  </div>

  <footer>
    Monitored every few minutes by an independent synthetic check (outside Minimo's own infrastructure).<br/>
    This page is static and hosted independently, so it stays up even if Minimo is down.
  </footer>
</div>

<script>
const LABELS = { operational:"Operational", degraded:"Degraded performance", down:"Outage", unknown:"Unknown" };
const OVERALL = {
  operational:"All systems operational",
  degraded:"Some systems degraded",
  down:"Active outage",
  unknown:"Status unavailable"
};
const REFRESH_MS = 60000;
// If the latest check is older than this, the data is stale → warn.
const STALE_MS = 20 * 60 * 1000;

function clsFor(s){ return s==="operational"?"ok":s==="degraded"?"degraded":s==="down"?"down":""; }
function timeAgo(iso){
  if(!iso) return "never";
  const s = Math.floor((Date.now() - new Date(iso).getTime())/1000);
  if(s<60) return s+"s ago";
  if(s<3600) return Math.floor(s/60)+"m ago";
  if(s<86400) return Math.floor(s/3600)+"h ago";
  return Math.floor(s/86400)+"d ago";
}

async function load(){
  let data;
  try{
    const r = await fetch("./status.json?_="+Date.now(), {cache:"no-store"});
    data = await r.json();
  }catch(e){
    document.getElementById("overall").textContent = "Status unavailable";
    return;
  }

  const now = Date.now();
  const last = data.updated_at ? new Date(data.updated_at).getTime() : 0;
  const stale = now - last > STALE_MS;

  // Overall
  let overall = data.overall || "unknown";
  if(stale) overall = "unknown";
  const banner = document.getElementById("banner");
  banner.classList.toggle("stale", stale);
  banner.querySelector(".big").style.background =
    "var(--"+(overall==="operational"?"ok":overall==="degraded"?"degraded":overall==="down"?"down":"dot-empty")+")";
  document.getElementById("overall").textContent = stale ? "Status data may be stale" : OVERALL[overall];
  document.getElementById("updated").textContent =
    "Last checked " + timeAgo(data.updated_at) + (stale ? " — checker may be down" : "");

  // Components
  const host = document.getElementById("components");
  host.innerHTML = "";
  (data.components||[]).forEach(c=>{
    const cls = clsFor(c.status);
    const el = document.createElement("div");
    el.className = "comp";
    const bars = (c.history||[]).map(h=>{
      const bc = h===null ? "" : clsFor(h);
      const title = h===null ? "no data" : LABELS[h]||h;
      return `<div class="bar ${bc?("b-"+bc):""}" title="${title}"></div>`;
    }).join("");
    el.innerHTML = `
      <div class="comp-top">
        <div class="comp-name"><span class="dot ${cls?("b-"+cls):""}"></span>${c.name}</div>
        <div class="status-label ${cls?("t-"+cls):""}">${LABELS[c.status]||c.status}${c.uptime_90d!=null?` · ${c.uptime_90d}%`:""}</div>
      </div>
      ${c.description?`<div class="desc">${c.description}</div>`:""}
      ${bars?`<div class="bars">${bars}</div><div class="bars-legend"><span>90 days ago</span><span>today</span></div>`:""}
    `;
    host.appendChild(el);
  });

  // Incidents
  const inc = data.incidents||[];
  if(inc.length){
    document.getElementById("incidents").style.display="";
    document.getElementById("incident-list").innerHTML = inc.map(i=>`
      <div class="inc">
        <div class="t-${clsFor(i.impact)||"down"}" style="font-weight:600">${i.title}</div>
        <div class="d">${i.date} · ${i.status||""}</div>
        ${i.body?`<div style="margin-top:6px;color:var(--muted)">${i.body}</div>`:""}
      </div>`).join("");
  }
}
load();
setInterval(load, REFRESH_MS);
</script>
</body>
</html>
